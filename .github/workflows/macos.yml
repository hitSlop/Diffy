name: macOS checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'assets/screenshot.png']
    tags: ['v*']
  pull_request:
    paths-ignore: ['**/*.md', 'assets/screenshot.png']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked --features ui-tests
      - run: cargo clippy --locked --all-targets --features ui-tests -- -D warnings
      - name: Install packager
        run: cargo install cargo-packager --version 0.11.8 --locked --root target/tools
      - name: Check macOS packages (unsigned)
        run: python3 scripts/release-macos.py --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: Diffy-macos-aarch64-unsigned
          path: dist/unsigned/*.dmg
          if-no-files-found: error
